<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Athlex</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #111;
      font-weight: bold;
      text-decoration: none;
    }

    .retour {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏋️ Athlex</h1>
  </header>

  <div class="container">

    <div class="card">

      <h2>📝 Créer un compte</h2>

      <p class="intro">
        Rejoins Athlex et commence ton parcours sportif.
      </p>

      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Ton nom">

      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" placeholder="Ton prénom">

      <label for="age">Âge</label>
      <input type="number" id="age" placeholder="Ton âge">

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" placeholder="Ton adresse e-mail">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Choisis un mot de passe">

      <label for="objectif">Ton objectif</label>
      <select id="objectif">
        <option value="">Choisir un objectif</option>
        <option>Perte de poids</option>
        <option>Prise de muscle</option>
        <option>Performance sportive</option>
        <option>Remise en forme</option>
        <option>Maintien</option>
      </select>

      <button onclick="inscription()">Créer mon compte</button>

      <div id="message"></div>

      <div class="login-link">
        Déjà un compte ?
        <a href="connexion.html">Se connecter</a>
      </div>

      <a class="retour" href="index.html">← Retour à l'accueil</a>

    </div>

  </div>

  <script>
    function inscription() {

      const nom = document.getElementById("nom").value.trim();
      const prenom = document.getElementById("prenom").value.trim();
      const age = document.getElementById("age").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const objectif = document.getElementById("objectif").value;

      const message = document.getElementById("message");

      if (!nom || !prenom || !age || !email || !password || !objectif) {
        message.style.color = "red";
        message.textContent = "⚠️ Veuillez remplir tous les champs.";
        return;
      }

      localStorage.setItem("athlexNom", nom);
      localStorage.setItem("athlexPrenom", prenom);
      localStorage.setItem("athlexAgeCompte", age);
      localStorage.setItem("athlexEmail", email);
      localStorage.setItem("athlexPassword", password);
      localStorage.setItem("athlexObjectifCompte", objectif);

      message.style.color = "green";
      message.textContent = "✅ Compte créé avec succès !";

      setTimeout(function() {
        window.location.href = "connexion.html";
      }, 1500);
    }
  </script>

</body>
</html>
