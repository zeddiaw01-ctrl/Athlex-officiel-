```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Athlex IA - Coach sportif</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070b12;
      color: white;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #0b111b;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #162333;
    }

    .logo {
      color: #00aaff;
      font-size: 28px;
      font-weight: 900;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00aaff;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 320px;
      padding: 70px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        linear-gradient(
          rgba(7, 11, 18, 0.82),
          rgba(7, 11, 18, 0.95)
        ),
        url("athlex-accueil.png") center/cover no-repeat;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #00aaff;
    }

    .hero p {
      color: #c9d3df;
      font-size: 18px;
      line-height: 1.6;
    }

    /* =========================
       SECTION IA
    ========================= */

    .ia-section {
      max-width: 950px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .ia-box {
      background: #0b111b;
      border: 1px solid #183047;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .ia-header {
      padding: 25px;
      background: #0d1622;
      border-bottom: 1px solid #183047;
    }

    .ia-header h2 {
      color: #00aaff;
      margin-bottom: 8px;
    }

    .ia-header p {
      color: #aebdca;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      min-height: 330px;
      max-height: 500px;
      overflow-y: auto;
      padding: 25px;

      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 80%;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ia-message {
      background: #101c29;
      border-left: 3px solid #00aaff;
      align-self: flex-start;
    }

    .user-message {
      background: #00aaff;
      color: white;
      align-self: flex-end;
    }

    .message strong {
      display: block;
      margin-bottom: 5px;
    }

    /* =========================
       FORMULAIRE
    ========================= */

    .chat-form {
      padding: 20px;
      border-top: 1px solid #183047;
      background: #0d1622;

      display: flex;
      gap: 12px;
    }

    .chat-form input {
      flex: 1;
      padding: 15px 18px;

      border-radius: 30px;
      border: 1px solid #29445c;
      outline: none;

      background: #070b12;
      color: white;

      font-size: 16px;
    }

    .chat-form input:focus {
      border-color: #00aaff;
    }

    .btn {
      border: none;
      padding: 15px 25px;

      border-radius: 30px;

      background: #00aaff;
      color: white;

      font-weight: 800;
      cursor: pointer;

      transition: 0.3s;
    }

    .btn:hover {
      background: #008ed6;
      transform: translateY(-2px);
    }

    /* =========================
       QUESTIONS RAPIDES
    ========================= */

    .ideas {
      margin-top: 30px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .idea {
      background: #0b111b;
      border: 1px solid #183047;

      padding: 20px;
      border-radius: 15px;

      text-align: center;
      cursor: pointer;

      transition: 0.3s;
    }

    .idea:hover {
      border-color: #00aaff;
      transform: translateY(-3px);
    }

    .idea span {
      display: block;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .idea h3 {
      color: #00aaff;
      margin-bottom: 8px;
    }

    .idea p {
      color: #aebdca;
      font-size: 14px;
      line-height: 1.5;
    }

    /
